# The game moved to Pixel Dungeon: Firelight (https://github.com/shiba-vibecoding/pixel-dungeon-firelight).
# This repository is archived: GitHub Pages here only redirects old links (with their query and the
# Telegram #tgWebAppData hash) to the Firelight site, and keeps the /proto/ engine demos.
# The server pd-coop is deployed from the Firelight repository now; never deploy it from here.

name: Redirect to Firelight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp -r packages/client/public/proto redirect/proto
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
