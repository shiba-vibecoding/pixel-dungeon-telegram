<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0c13">
<title>Демо · Top-down · варианты вида</title>
<!-- Pixel Dungeon TS, prototype C: strictly top-down, raw WebGL2: a small deferred pipeline (albedo + normal buffers, one lighting pass).
     Variants (all toggles, combinable): light in the dark, normal maps, depth layers, sewer atmosphere, noir scouting. Not part of the game. -->
<script src="scene.js"></script>
<style>
  .td-panel{position:fixed;left:10px;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 70px);z-index:6;background:rgba(9,11,19,.9);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px;display:none;flex-direction:column;gap:8px;font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#dfe6ff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .td-panel.open{display:flex}
  .td-row{display:flex;flex-wrap:wrap;gap:6px}
  .td-chip{font:600 12px system-ui,sans-serif;min-height:36px;padding:0 11px;color:#dfe6ff;background:rgba(30,36,56,.8);border:1px solid rgba(255,255,255,.2);border-radius:999px;cursor:pointer;touch-action:manipulation}
  .td-chip[aria-pressed=true]{background:rgba(255,200,87,.2);border-color:#ffc857;color:#ffe3a3}
  .td-chip.rec{background:rgba(70,140,90,.25);border-color:#6fd08a;color:#c9f5d4}
  .td-slider{display:flex;align-items:center;gap:8px}
  .td-slider input{flex:1;min-width:0}
  .td-float{position:fixed;left:0;top:0;z-index:4;pointer-events:none;font:800 18px ui-monospace,Consolas,monospace;text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000,0 0 6px #000;white-space:nowrap;will-change:transform}
</style>
</head>
<body>
<div class="td-panel" id="td-panel">
  <div class="td-row"><button class="td-chip rec" id="td-rec" type="button">Пресет: рекомендованный</button></div>
  <div class="td-row" id="td-chips"></div>
  <label class="td-slider">нормали <input id="td-ns" type="range" min="0" max="3" step="0.1"><b id="td-nsv"></b></label>
</div>
<script>
(function () {
  'use strict';
  var S = window.PDScene;
  try {
    S.extras = true; // the fireball and mobs that can die (the chest stays off: no chest here)
    S.load().then(function () { S.chest = null; start(); }).catch(S.fatal);
  } catch (e) { S.fatal(e); }

  function start() {
    var W = S.W, H = S.H, T = S.T;
    var RAYS = 256;
    var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
    var rnd = function (a, b) { return a + Math.random() * (b - a); };

    /* ------------------------------------------------------------ settings */
    var KEY = 'pd-td-v1';
    var REC = { dark: 1, norm: 1, par: 1, atm: 1, noir: 0, hq: 1, classic: 0, ns: 0.8 };
    var st = Object.assign({}, REC);
    try { var saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) st = Object.assign(st, saved); } catch (_) { /* private mode */ }
    var save = function () { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_) { /* ignore */ } };
    /** What is really on: «Классика» switches every variant off without forgetting the choices. */
    var eff = function (k) { return st.classic ? 0 : st[k]; };

    /* --------------------------------------------------------------- canvas, GL */
    var canvas = document.createElement('canvas');
    canvas.className = 'pd-view';
    document.body.appendChild(canvas);
    var gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
    if (!gl) { S.fatal(new Error('нужен WebGL2')); return; }
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var vw = window.innerWidth, vh = window.innerHeight, cw = 1, ch = 1, gw = 1, gh = 1, q = 1;

    function compile(type, src) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      return sh;
    }
    function program(vs, fs) {
      var p = gl.createProgram();
      gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
      gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      var u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (var i = 0; i < n; i++) { var info = gl.getActiveUniform(p, i); var nm = info.name.replace('[0]', ''); u[nm] = gl.getUniformLocation(p, info.name); }
      return { p: p, u: u };
    }

    var VS_SPRITE = '#version 300 es\n' +
      'layout(location=0) in vec2 aPos; uniform vec4 uRect; uniform vec4 uUV; uniform vec2 uShift; uniform vec2 uCam; uniform float uScale; uniform vec2 uCenter; uniform vec2 uSize; out vec2 vUV;\n' +
      'void main(){ vec2 p = uRect.xy + aPos * uRect.zw + uShift; vec2 g = (p - uCam) * uScale + uCenter; gl_Position = vec4(g.x / uSize.x * 2. - 1., 1. - g.y / uSize.y * 2., 0., 1.); vUV = uUV.xy + aPos * uUV.zw; }';
    var FS_G = '#version 300 es\nprecision highp float; in vec2 vUV; uniform sampler2D uAlb; uniform sampler2D uNor; uniform vec4 uTint; uniform float uHasN;\n' +
      'layout(location=0) out vec4 oA; layout(location=1) out vec4 oN;\n' +
      'void main(){ vec4 c = texture(uAlb, vUV); float a = c.a * uTint.a; vec3 n = uHasN > .5 ? texture(uNor, vUV).rgb : vec3(.5, .5, 1.); oA = vec4(c.rgb * uTint.rgb, a); oN = vec4(n, a); }';
    var FS_F = '#version 300 es\nprecision highp float; in vec2 vUV; uniform sampler2D uAlb; uniform vec4 uTint; out vec4 o;\n' +
      'void main(){ o = texture(uAlb, vUV) * uTint; }';
    var VS_FULL = '#version 300 es\nvoid main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2. - 1., 0., 1.); }';
    var FS_LIGHT = '#version 300 es\nprecision highp float; precision highp sampler2D;\n' +
      'uniform sampler2D uAlb; uniform sampler2D uNor; uniform sampler2D uBlue; uniform sampler2D uExp; uniform sampler2D uRays;\n' +
      'uniform vec2 uCanvas; uniform vec2 uGsize; uniform vec2 uGcenter; uniform float uGscale; uniform vec2 uCam; uniform vec2 uMap;\n' +
      'uniform vec4 uLp[4]; uniform vec3 uLc[4]; uniform vec3 uVis;\n' +
      'uniform float uAmb; uniform float uStr; uniform float uNormOn; uniform float uShadowOn; uniform float uDark; uniform float uNoir; uniform float uLightsOn; uniform float uFlash;\n' +
      'out vec4 o;\n' +
      'const float TAU = 6.2831853; const float RAYS = 256.;\n' +
      'float ray(int row, float ang){ float f = ang / TAU * RAYS; float i0 = floor(f); float t = f - i0; int a = int(mod(i0, RAYS)); int b = int(mod(i0 + 1., RAYS));\n' +
      '  return mix(texelFetch(uRays, ivec2(a, row), 0).r, texelFetch(uRays, ivec2(b, row), 0).r, t); }\n' +
      'float shadow(int row, vec2 lp, vec2 fp, float R, float softK){ vec2 d = fp - lp; float dist = length(d); if (dist >= R) return 0.; if (dist < .001) return 1.;\n' +
      '  float ang = atan(d.y, d.x); if (ang < 0.) ang += TAU; float soft = softK / (dist + .7); float acc = 0.;\n' +
      '  for (int k = 0; k < TAPS; k++){ float a = mod(ang + ((float(k) + .5) / float(TAPS) - .5) * 2. * soft + TAU, TAU); acc += clamp((ray(row, a) - dist) * 3.5 + .5, 0., 1.); }\n' +
      '  return acc / float(TAPS); }\n' +
      'void main(){\n' +
      '  vec2 uv = gl_FragCoord.xy / uCanvas; vec4 alb = texture(uAlb, uv); vec3 nm = texture(uNor, uv).rgb * 2. - 1.;\n' +
      '  vec2 gp = vec2(uv.x, 1. - uv.y) * uGsize; vec2 cp = ((gp - uGcenter) / uGscale + uCam) / 16.;\n' +
      '  vec3 N = vec3(0., 0., 1.); if (uNormOn > .5) N = normalize(vec3(nm.xy * uStr, max(nm.z, .15)));\n' +
      '  vec3 acc = vec3(uAmb);\n' +
      '  if (uLightsOn > .5) for (int i = 0; i < 4; i++){ vec4 L = uLp[i]; if (L.w <= 0.) continue; vec2 d = L.xy - cp; float dist = length(d); if (dist >= L.z) continue;\n' +
      '    float att = 1. - dist / L.z; att *= att; float s = uShadowOn > .5 ? shadow(i + 1, L.xy, cp, L.z, .5) : 1.;\n' +
      '    float nl = uNormOn > .5 ? max(dot(N, normalize(vec3(d, .9))), 0.) * 1.15 : .85; acc += uLc[i] * L.w * att * s * nl; }\n' +
      '  vec3 lit = alb.rgb * acc * (1. + uFlash * .7); vec3 col = lit; float vis = 1.;\n' +
      '  if (uDark > .5 || uNoir > .5) vis = shadow(0, uVis.xy, cp, uVis.z, .18);\n' +
      '  if (uDark > .5){ float ex = texture(uExp, cp / uMap).r; float l = dot(alb.rgb, vec3(.3, .59, .11)); vec3 dim = vec3(.05, .09, .2) * (.35 + 1.4 * l) * ex; col = mix(dim, lit, vis); }\n' +
      '  if (uNoir > .5){ vec3 bp = texture(uBlue, cp / uMap).rgb; col = mix(bp, lit, vis) + vec3(.1, .4, .7) * vis * (1. - vis) * .9; }\n' +
      '  o = vec4(col, 1.); }';

    var progG = program(VS_SPRITE, FS_G), progF = program(VS_SPRITE, FS_F);
    var progL = null, progLTaps = -1;
    function lightProgram(taps) {
      if (progLTaps === taps) return progL;
      progL = program(VS_FULL, FS_LIGHT.replace(/TAPS/g, String(taps)));
      progLTaps = taps;
      return progL;
    }

    var quadBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
    var vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    var emptyVao = gl.createVertexArray();

    /* ------------------------------------------------------------- textures */
    function tex(src, o) {
      o = o || {};
      var t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
      var f = o.linear ? gl.LINEAR : gl.NEAREST;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
      var w = o.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, w);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, w);
      return { t: t, w: src.width, h: src.height };
    }
    function mkCanvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

    /** A normal map made from a picture: height from luminance (and its outline), Sobel for the slopes. */
    function normalMap(src, k, withAlpha) {
      var w = src.width, h = src.height, c = mkCanvas(w, h), g = c.getContext('2d', { willReadFrequently: true });
      g.drawImage(src, 0, 0);
      var d = g.getImageData(0, 0, w, h), px = d.data, ht = new Float32Array(w * h);
      for (var i = 0; i < w * h; i++) {
        var a = px[i * 4 + 3] / 255, lum = (0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]) / 255;
        ht[i] = withAlpha ? (lum * 0.6 + 0.4) * a : lum;
      }
      var at = function (x, y) { return ht[clamp(y, 0, h - 1) * w + clamp(x, 0, w - 1)]; };
      var out = g.createImageData(w, h);
      for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
          var dx = (at(x + 1, y - 1) + 2 * at(x + 1, y) + at(x + 1, y + 1)) - (at(x - 1, y - 1) + 2 * at(x - 1, y) + at(x - 1, y + 1));
          var dy = (at(x - 1, y + 1) + 2 * at(x, y + 1) + at(x + 1, y + 1)) - (at(x - 1, y - 1) + 2 * at(x, y - 1) + at(x + 1, y - 1));
          var nx = -dx * k, ny = -dy * k, nz = 1, l = Math.sqrt(nx * nx + ny * ny + nz * nz), o = (y * w + x) * 4;
          out.data[o] = (nx / l * 0.5 + 0.5) * 255; out.data[o + 1] = (ny / l * 0.5 + 0.5) * 255; out.data[o + 2] = (nz / l * 0.5 + 0.5) * 255;
          out.data[o + 3] = px[o + 3];
        }
      }
      g.putImageData(out, 0, 0);
      return c;
    }
    /** An albedo texture and its generated normal map. */
    function pair(src, k, withAlpha, o) { return { a: tex(src, o), n: tex(normalMap(src, k, withAlpha), o) }; }

    // The level: the floor (and the water's edges), the plants, and the walls, baked apart so they can drift as layers.
    var TILES = S.img.tiles;
    function bake(wallsOnly) {
      var c = mkCanvas(W * T, H * T), g = c.getContext('2d');
      g.imageSmoothingEnabled = false;
      var tile = function (idx, x, y) { g.drawImage(TILES, (idx % 16) * T, Math.floor(idx / 16) * T, T, T, x * T, y * T, T, T); };
      var ground = function (x, y) { var ch = S.kind(x, y); return ch === '.' || ch === 'D'; };
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          var ch = S.kind(x, y), wall = S.isWall(x, y) || ch === 'D';
          if (wallsOnly) { if (wall) tile(S.wallTile(x, y), x, y); continue; }
          if (wall) { g.fillStyle = '#050608'; g.fillRect(x * T, y * T, T, T); }
          else if (ch === '~') {
            var m = (ground(x, y - 1) ? 1 : 0) + (ground(x + 1, y) ? 2 : 0) + (ground(x, y + 1) ? 4 : 0) + (ground(x - 1, y) ? 8 : 0);
            tile(S.TILE.WATER + m, x, y);
          } else tile(S.floorTile(x, y), x, y);
        }
      }
      return c;
    }
    var floorP = pair(bake(false), 1.7, false);
    var wallsP = pair(bake(true), 1.7, false);
    var waterP = pair(S.img.water, 2.0, false, { repeat: true });
    var featP = pair(S.img.features, 1.6, true);
    var doorP = [pair(S.tileCanvas(S.TILE.DOOR), 2.6, false), pair(S.tileCanvas(S.TILE.DOOR_OPEN), 2.6, false)];
    var sheetP = { warrior: pair(S.img.warrior, 1.5, true), rat: pair(S.img.rat, 1.5, true), gnoll: pair(S.img.gnoll, 1.5, true) };
    var whites = {};
    var white = function (key) { return whites[key] || (whites[key] = tex(S.whiteCanvas(key))); };
    var ambientT = tex(S.img.ambient);

    function soft(size, stops, linear) { return tex(S.radialCanvas(size, stops), { linear: linear !== false }); }
    var dotT = soft(32, [[0, 'rgba(255,255,255,1)'], [0.5, 'rgba(255,255,255,0.6)'], [1, 'rgba(255,255,255,0)']]);
    var glowT = soft(128, [[0, 'rgba(255,255,255,0.9)'], [0.3, 'rgba(255,255,255,0.35)'], [1, 'rgba(255,255,255,0)']]);
    var mistT = soft(128, [[0, 'rgba(210,222,245,0.55)'], [0.5, 'rgba(210,222,245,0.22)'], [1, 'rgba(210,222,245,0)']]);
    var smokeT = soft(128, [[0, 'rgba(60,56,52,0.7)'], [0.6, 'rgba(45,42,40,0.35)'], [1, 'rgba(30,28,26,0)']]);
    var blobT = soft(32, [[0, 'rgba(0,0,0,0.6)'], [0.6, 'rgba(0,0,0,0.3)'], [1, 'rgba(0,0,0,0)']]);
    var pixC = mkCanvas(4, 4);
    pixC.getContext('2d').fillStyle = '#fff'; pixC.getContext('2d').fillRect(0, 0, 4, 4);
    var pixT = tex(pixC);
    var ringC = mkCanvas(128, 128);
    { var rg = ringC.getContext('2d'); rg.strokeStyle = '#fff'; rg.lineWidth = 4; rg.beginPath(); rg.arc(64, 64, 58, 0, 7); rg.stroke(); }
    var ringT = tex(ringC, { linear: true });

    /** The whole level as a blueprint: outline lines on dark blue. */
    function blueprint() {
      var k = 4, c = mkCanvas(W * T * k, H * T * k), g = c.getContext('2d'), cs = T * k;
      g.fillStyle = '#06142e'; g.fillRect(0, 0, c.width, c.height);
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          var ch = S.kind(x, y);
          g.fillStyle = S.isWall(x, y) ? '#0f2a57' : ch === '~' ? '#0a2a55' : '#08193a';
          g.fillRect(x * cs, y * cs, cs, cs);
          if (ch === '~') {
            g.save(); g.beginPath(); g.rect(x * cs, y * cs, cs, cs); g.clip();
            g.strokeStyle = 'rgba(74,163,255,0.55)'; g.lineWidth = 2;
            for (var i = -cs; i < cs * 2; i += 12) { g.beginPath(); g.moveTo(x * cs + i, y * cs); g.lineTo(x * cs + i + cs, y * cs + cs); g.stroke(); }
            g.restore();
          }
        }
      }
      g.strokeStyle = 'rgba(70,130,220,0.22)'; g.lineWidth = 1;
      for (var gx = 0; gx <= W; gx++) { g.beginPath(); g.moveTo(gx * cs, 0); g.lineTo(gx * cs, c.height); g.stroke(); }
      for (var gy = 0; gy <= H; gy++) { g.beginPath(); g.moveTo(0, gy * cs); g.lineTo(c.width, gy * cs); g.stroke(); }
      g.strokeStyle = '#8fd8ff'; g.lineWidth = 4; g.lineCap = 'square';
      var wl = function (x, y) { return S.isWall(x, y); };
      for (var yy = 0; yy < H; yy++) {
        for (var xx = 0; xx < W; xx++) {
          if (!wl(xx, yy)) continue;
          var seg = function (x1, y1, x2, y2) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
          if (!wl(xx, yy - 1) && yy > 0) seg(xx * cs, yy * cs, xx * cs + cs, yy * cs);
          if (!wl(xx, yy + 1) && yy < H - 1) seg(xx * cs, yy * cs + cs, xx * cs + cs, yy * cs + cs);
          if (!wl(xx - 1, yy) && xx > 0) seg(xx * cs, yy * cs, xx * cs, yy * cs + cs);
          if (!wl(xx + 1, yy) && xx < W - 1) seg(xx * cs + cs, yy * cs, xx * cs + cs, yy * cs + cs);
        }
      }
      g.strokeStyle = '#ffd24a'; g.lineWidth = 5;
      g.strokeRect(S.doorCell.x * cs + 6, S.doorCell.y * cs + 6, cs - 12, cs - 12);
      g.fillStyle = '#ff9a3c'; g.beginPath(); g.arc(8.5 * cs, 0.5 * cs, 9, 0, 7); g.fill();
      return c;
    }
    var blueT = tex(blueprint(), { linear: true });

    // Per-light ray distances (5 rows: sight, hero, torch, mushroom, fire), and the explored map.
    var rayData = new Float32Array(RAYS * 5);
    var rayT = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, rayT);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, RAYS, 5, 0, gl.RED, gl.FLOAT, rayData);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    var exData = new Uint8Array(W * H);
    var exT = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, exT);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, W, H, 0, gl.RED, gl.UNSIGNED_BYTE, exData);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    /* ---------------------------------------------------- the G-buffer (albedo + normal) */
    var fbo = gl.createFramebuffer(), gA = null, gN = null;
    function makeTarget(w, h) {
      var t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    }
    function resize() {
      vw = window.innerWidth; vh = window.innerHeight;
      q = st.hq ? 1 : 0.5;
      cw = Math.round(vw * dpr); ch = Math.round(vh * dpr);
      canvas.width = cw; canvas.height = ch;
      gw = Math.max(1, Math.round(cw * q)); gh = Math.max(1, Math.round(ch * q));
      if (gA) { gl.deleteTexture(gA); gl.deleteTexture(gN); }
      gA = makeTarget(gw, gh); gN = makeTarget(gw, gh);
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, gA, 0);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, gN, 0);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }

    /* --------------------------------------------------------------- camera */

      }
      // ripples (stepping in or beside water) and the tap ring
      S.ripples.forEach(function (r) {
        if (r.age < 0 || (!atm && !r.tap)) return;
        var p = r.age / r.life, rad = 4 + p * (r.tap ? 16 : r.big ? 20 : 13);
        quad(progF, ringT, null, r.x * T - rad, r.y * T - rad * 0.55, rad * 2, rad * 1.1, FULL, r.tap ? [1, 1, 1, (1 - p) * 0.6] : [0.7, 0.88, 1, (1 - p) * 0.85], null);
      });
      // sparks, embers, the fireball and its flash
      for (i = parts.length - 1; i >= 0; i--) {
        var pp = parts[i];
        pp.age += sdt * 1000;
        if (pp.age >= pp.life) { parts.splice(i, 1); continue; }
        pp.vh += pp.g * sdt; pp.x += pp.vx * sdt; pp.y += pp.vy * sdt; pp.h = Math.max(0, pp.h + pp.vh * sdt);
        if (pp.t === 'pix') { var k2 = pp.age / pp.life; dot(pp.x * T, (pp.y - pp.h) * T, Math.max(1, pp.s0 | 0), Math.max(1, pp.s0 | 0), pp.col, (1 - k2) * 1.2); }
      }
      if (S.fire) {
        var fl = 0.85 + 0.15 * Math.sin(clock / 28);
        halo(S.fire.x * T, (S.fire.y - 0.5) * T, 44 * fl, [1, 0.55, 0.2], 0.9);
        dot(S.fire.x * T - 2, (S.fire.y - 0.5) * T - 2, 4, 4, [1, 0.95, 0.7], 1);
        if (sdt > 0) emit({ x: S.fire.x - (S.fire.dx || 0) * 0.2, y: S.fire.y, h: 0.5, vx: rnd(-0.3, 0.3), vy: rnd(-0.2, 0.2), vh: rnd(0, 0.6), g: -1.5, life: rnd(250, 450), s0: 1, col: [1, rnd(0.55, 0.9), 0.3] });
      }
      if (boom) {
        var b2 = clock - boom.t0;
        if (b2 < 320) halo(boom.x * T, (boom.y - 0.4) * T, 30 + b2 * 0.5, [1, 0.8, 0.5], Math.max(0, 1 - b2 / 300));
        if (b2 < 450) { var rr = 6 + b2 * 0.14; quad(progF, ringT, null, boom.x * T - rr, boom.y * T - rr * 0.55, rr * 2, rr * 1.1, FULL, [1, 0.7, 0.35, Math.max(0, 1 - b2 / 450) * 0.8], null); }
      }
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      syncFloaters();
    }

    /* ---------------------------------------------------------------- the panel */
    var CHIPS = [['dark', 'Свет в темноте'], ['norm', 'Живые пиксели'], ['par', 'Слои глубины'], ['atm', 'Атмосфера канализации'], ['noir', 'Нуар-разведка'], ['classic', 'Классика']];
    var chipEls = {};
    var chipsEl = document.getElementById('td-chips');
    CHIPS.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'td-chip'; b.textContent = c[1];
      b.addEventListener('click', function () {
        st[c[0]] = st[c[0]] ? 0 : 1;
        if (st[c[0]] && c[0] === 'dark') st.noir = 0;     // the two ways of showing what you can't see exclude each other
        if (st[c[0]] && c[0] === 'noir') st.dark = 0;
        if (c[0] !== 'classic' && st[c[0]]) st.classic = 0;
        refresh();
      });
      chipsEl.appendChild(b); chipEls[c[0]] = b;
    });
    var qb = document.createElement('button');
    qb.type = 'button'; qb.className = 'td-chip';
    qb.addEventListener('click', function () { st.hq = st.hq ? 0 : 1; refresh(); resize(); updateCam(); });
    chipsEl.appendChild(qb);
    var ns = document.getElementById('td-ns'), nsv = document.getElementById('td-nsv');
    ns.addEventListener('input', function () { st.ns = +ns.value; refresh(); });
    document.getElementById('td-rec').addEventListener('click', function () { st = Object.assign(st, REC, { hq: st.hq }); refresh(); });
    function refresh() {
      CHIPS.forEach(function (c) { chipEls[c[0]].setAttribute('aria-pressed', st[c[0]] ? 'true' : 'false'); });
      qb.textContent = st.hq ? 'кач.: высокое' : 'кач.: низкое';
      qb.setAttribute('aria-pressed', st.hq ? 'true' : 'false');
      ns.value = st.ns; nsv.textContent = (+st.ns).toFixed(1);
      info();
      save();
    }
    var hud = S.hud({
      title: 'Top-down · WebGL2',
      other: { href: 'hd2d.html', label: 'HD-2D →' },
      hint: 'тап — идти · драг — сдвиг · щипок — зум · ⚙ — варианты',
      actions: [
        { label: '🔥 Огненный шар', click: function () { var r = S.castFireball(); if (r === -1) hud.toast('Нет целей в поле зрения', '#9fd0ff'); } },
        { label: '⚙', click: function () { document.getElementById('td-panel').classList.toggle('open'); } },
      ],
      toggles: [],
    });
    function info() { hud.setInfo('WebGL2 · ' + dpr + 'x' + (st.classic ? ' · классика' : '') + (st.hq ? '' : ' · low')); }
    document.getElementById('td-panel').classList.add('open');

    window.addEventListener('resize', function () { resize(); updateCam(); });
    resize();
    updateCam();
    refresh();
    S.run(frame);
    frame(16);
    window.__td = { st: st, get state() { return st; }, refresh: refresh, gl: gl };
  }
})();
</script>
</body>
