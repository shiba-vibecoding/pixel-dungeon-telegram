  .ph-bot{position:absolute;left:0;right:0;bottom:0;padding:0 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const S = window.PDScene;
try {
  S.extras = true;
  await S.load();
  await S.loadExtras();
  S.enableExtras();
  const { W, H, T } = S;
  const rad = (d) => (d * Math.PI) / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const touch = (navigator.maxTouchPoints || 0) > 0;

  /* ---------------------------------------------------------------- renderer */
  const pr = Math.min(window.devicePixelRatio || 1, 2);
  let vw = window.innerWidth, vh = window.innerHeight, cp = pr;
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(pr);
  renderer.setSize(vw, vh);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.domElement.className = 'pd-view';
  document.body.appendChild(renderer.domElement);

  let lightOn = true, postOn = true, hq = true, photo = false, filterMode = 0;
  const hud = S.hud({
    title: 'HD-2D · Three.js r' + THREE.REVISION,
    other: { href: 'pixi.html', label: '← 2D-свет (Pixi)' },
    hint: 'тап — идти · тап по сундуку — открыть · драг — сдвиг · щипок — зум',
    actions: [
      { label: '🔥 Огненный шар', click: () => castFire() },
      { label: '📷', click: () => enterPhoto() },
    ],
    toggles: [
      { id: 'light', on: 'свет вкл', off: 'свет выкл', value: true, change: (v) => { lightOn = v; applyLight(); } },
      { id: 'post', on: 'пост вкл', off: 'пост выкл', value: true, change: (v) => { postOn = v; } },
      { id: 'q', on: 'кач.: высокое', off: 'кач.: низкое', value: true, change: (v) => { hq = v; applyQuality(); } },
    ],
  });
  hud.setInfo((renderer.capabilities.isWebGL2 ? 'WebGL2' : 'WebGL1') + ' · ' + pr + 'x' + (touch ? ' · touch' : ''));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07080d);
  scene.fog = new THREE.Fog(0x07080d, 60, 120);
  const FOV = 28;
  const camera = new THREE.PerspectiveCamera(FOV, vw / vh, 8, 160);

  /* ------------------------------------------------------------------ sound */
  let ac = null;
  const audio = () => {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
    return ac;
  };
  const tone = (f0, f1, dur, type, vol, delay) => {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol || 0.07, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.03);
  };
  const noise = (dur, vol) => {
    if (!ac) return;
    const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = vol;
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
  };
  const sfx = {
    open: () => { tone(300, 640, 0.25, 'triangle', 0.06); tone(900, 1300, 0.3, 'sine', 0.04, 0.1); },
    land: () => tone(520, 380, 0.12, 'triangle', 0.05),
    pickup: () => { tone(880, 1760, 0.12, 'sine', 0.06); tone(1320, 2100, 0.16, 'sine', 0.05, 0.07); },
    cast: () => tone(520, 110, 0.28, 'sawtooth', 0.035),
    boom: () => { noise(0.55, 0.28); tone(130, 34, 0.45, 'sine', 0.2); },
  };

  /* ---------------------------------------------------------------- textures */
  const pix = (src, repeatX, repeatY) => {
    const t = new THREE.Texture(src);
    t.colorSpace = THREE.SRGBColorSpace;
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestFilter;
    t.generateMipmaps = false;
    if (repeatX) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeatX, repeatY); }
    t.needsUpdate = true;
    return t;
  };
  const tileTexCache = new Map();
  const tileTex = (idx, rx, ry, oy) => {
    const key = idx + ':' + (rx || 1) + ':' + (ry || 1) + ':' + (oy || 0);
    let t = tileTexCache.get(key);
    if (!t) {
      t = pix(S.tileCanvas(idx));
      if (rx) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.offset.set(0, oy || 0); }
      tileTexCache.set(key, t);
    }
    return t;
  };
  const soft = (size, stops) => { const t = new THREE.CanvasTexture(S.radialCanvas(size, stops)); t.colorSpace = THREE.SRGBColorSpace; return t; };
  /** A sub-rectangle of a sheet as its own texture (the sheet's image is shared). */
  const baseTexs = new Map();
  const rectTex = (img, sx, sy, w, h, flip) => {
    let base = baseTexs.get(img);
    if (!base) { base = pix(img); baseTexs.set(img, base); }
    const t = base.clone();
    t.repeat.set((flip ? -w : w) / img.width, h / img.height);
    t.offset.set((flip ? sx + w : sx) / img.width, 1 - (sy + h) / img.height);
    return t;
  };

  /** Tileable value noise (a few octaves) for fog and mist, made once. */
  function makeNoise(size) {
    const data = new Uint8Array(size * size * 4);
    const octs = [[4, 0.5], [8, 0.27], [16, 0.15], [32, 0.08]].map(([n, w]) => ({ n, w, a: Float32Array.from({ length: n * n }, Math.random) }));
    const sm = (t) => t * t * (3 - 2 * t);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        let v = 0;
        for (const o of octs) {
          const fx = (x / size) * o.n, fy = (y / size) * o.n, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = sm(fx - x0), ty = sm(fy - y0);
          const g = (i, j) => o.a[(j % o.n) * o.n + (i % o.n)];
          const a = g(x0, y0) + (g(x0 + 1, y0) - g(x0, y0)) * tx, b = g(x0, y0 + 1) + (g(x0 + 1, y0 + 1) - g(x0, y0 + 1)) * tx;
          v += o.w * (a + (b - a) * ty);
        }
        const i = (y * size + x) * 4;
        data[i] = data[i + 1] = data[i + 2] = Math.min(255, v * 255); data[i + 3] = 255;
      }
    }
    const t = new THREE.DataTexture(data, size, size);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.magFilter = t.minFilter = THREE.LinearFilter;
    t.needsUpdate = true;
    return t;
  }
  const noiseTex = makeNoise(128);

  /* the fog of war: 1 where the hero has seen (a 12 x 10 texture, filtered smooth) */
  const exData = new Uint8Array(W * H);
  const exTex = new THREE.DataTexture(exData, W, H, THREE.RedFormat);
  exTex.magFilter = exTex.minFilter = THREE.LinearFilter;
  exTex.wrapS = exTex.wrapT = THREE.ClampToEdgeWrapping;
  exTex.unpackAlignment = 1;
  let exCell = -1;
  function explore() {
    const h = S.hero, k = h.cx + h.cy * W;
    if (k === exCell) return;
    exCell = k;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (Math.hypot(x - h.cx, y - h.cy) <= 4.6) exData[x + y * W] = 255;
    exTex.needsUpdate = true;
  }

  /* shared uniforms of the custom shaders */
  const fx = {
    time: { value: 0 }, tNoise: { value: noiseTex }, tExp: { value: exTex },
    torchPos: { value: new THREE.Vector3(4.5, 0.7, 1.4) }, torchI: { value: 1 }, heroPos: { value: new THREE.Vector3() },
    beamPos: { value: new THREE.Vector3(8.3, 0, 6.2) }, beamI: { value: 1 },
  };
  const TORCH_X = 4.5;
  const BEAM = { x: 8.3, z: 6.2, h: 3.7, tilt: new THREE.Euler(-0.2, 0, -0.34) };
  const noReflect = new THREE.Group();   // what the mirror must not show: fog, mist, numbers
  const floatGroup = new THREE.Group();
  scene.add(noReflect, floatGroup);

  /* ---------------------------------------------------------------- diorama */
  const WALL_H = 1.1;
  const diorama = new THREE.Group();
  scene.add(diorama);

  const waterT = pix(S.img.water, (W * T) / 32, (H * T) / 32);
  const sideZ = new THREE.MeshLambertMaterial({ map: tileTex(48, W, 1, 0), color: 0x555a6e });
  const sideX = new THREE.MeshLambertMaterial({ map: tileTex(48, H, 1, 0), color: 0x555a6e });
  const slabTop = new THREE.MeshLambertMaterial({ map: waterT });
  const bottom = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const slab = new THREE.Mesh(new THREE.BoxGeometry(W, 0.7, H), [sideX, sideX, slabTop, bottom, sideZ, sideZ]);
  slab.position.set(W / 2, -0.35, H / 2);
  slab.receiveShadow = true;
  diorama.add(slab);

  const groundT = pix(S.groundCanvas);
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(W, H).rotateX(-Math.PI / 2),
    new THREE.MeshLambertMaterial({ map: groundT, transparent: true, alphaTest: 0.02 }),
  );
  floor.position.set(W / 2, 0.01, H / 2);
  floor.receiveShadow = true;
  diorama.add(floor);

  const topMat = new THREE.MeshLambertMaterial({ map: tileTex(48), color: 0x80869e });
  const faceMats = new Map();
  const faceMat = (idx, h) => {
    const key = idx + ':' + h;
    let m = faceMats.get(key);
    if (!m) { m = new THREE.MeshLambertMaterial({ map: tileTex(idx, 1, Math.min(1, h / WALL_H), 1 - Math.min(1, h / WALL_H)) }); faceMats.set(key, m); }
    return m;
  };
  const doorClosed = tileTex(S.TILE.DOOR), doorOpen = tileTex(S.TILE.DOOR_OPEN);
  const doorMat = new THREE.MeshLambertMaterial({ map: doorClosed });
  const pillars = new Set(['6,3', '6,4', '4,6', '5,6']);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const ch = S.kind(x, y);
      if (!(S.isWall(x, y) || ch === 'D')) continue;
      const h = y === H - 1 ? 0.36 : pillars.has(x + ',' + y) ? 0.82 : WALL_H;
      const side = faceMat(ch === 'P' ? S.TILE.FACE_PIPE : S.TILE.FACE, h);
      const plain = faceMat(S.TILE.FACE, h);
      const m = new THREE.Mesh(new THREE.BoxGeometry(1, h, 1), [plain, plain, topMat, topMat, ch === 'D' ? doorMat : side, plain]);
      m.position.set(x + 0.5, h / 2, y + 0.5);
      m.castShadow = true; m.receiveShadow = true;
      diorama.add(m);
    }
  }

  const planted = [];
  const featBase = pix(S.img.features);
  S.decor.forEach((d) => {
    const t = featBase.clone();
    t.repeat.set(16 / S.img.features.width, 16 / S.img.features.height);
    t.offset.set(((d.tile % 16) * 16) / S.img.features.width, 1 - ((Math.floor(d.tile / 16) + 1) * 16) / S.img.features.height);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9).translate(0, 0.45, 0),
      new THREE.MeshLambertMaterial({ map: t, alphaTest: 0.5, side: THREE.DoubleSide }));
    m.position.set(d.x + 0.5, 0, d.y + 0.62);
    m.castShadow = true;
    diorama.add(m);
    planted.push(m);
  });

  /* ------------------------------------------------- (1) water that reflects */
  // A Reflector (a mirrored half-resolution render of the scene) lies just under the floor, so it shows only
  // through the puddle's clear cells; its own shader adds the water texture, a wobble and the rings.
  const WaterShader = {
    name: 'WaterShader',
    uniforms: {
      color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, tWater: { value: waterT },
      time: { value: 0 }, rip: { value: Array.from({ length: 8 }, () => new THREE.Vector4(0, 0, 0, 0)) },
    },
    vertexShader: `
      uniform mat4 textureMatrix; varying vec4 vUv; varying vec2 vP;
      void main() {
        vUv = textureMatrix * vec4(position, 1.0);
        vP = vec2(position.x + ${(W / 2).toFixed(1)}, ${(H / 2).toFixed(1)} - position.y);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 color; uniform sampler2D tDiffuse; uniform sampler2D tWater; uniform float time; uniform vec4 rip[8];
      varying vec4 vUv; varying vec2 vP;
      #include <common>
      void main() {
        vec2 n = vec2(sin(vP.y * 7.0 + time * 1.6) + sin(vP.x * 5.0 - time * 1.1), cos(vP.x * 8.0 + time * 1.3) + cos(vP.y * 6.0 - time * 0.9)) * 0.0035;
        float hi = 0.0;
        for (int i = 0; i < 8; i++) {
          vec4 r = rip[i];
          if (r.w > 0.0) {
            vec2 d = vP - r.xy; float L = length(d);
            float w = exp(-pow((L - r.z) * 7.0, 2.0)) * r.w;
            n += d / (L + 0.001) * w * 0.028;
            hi += w;
          }
        }
        vec4 pr = vUv; pr.xy += n * pr.w * 2.0;
        vec3 refl = texture2DProj(tDiffuse, pr).rgb;
        vec3 wat = texture2D(tWater, vec2(vP.x * 0.5, vP.y * 0.5 - time * 0.156)).rgb;
        vec3 col = mix(wat * 0.5, refl, 0.6) + hi * vec3(0.38, 0.5, 0.62) * 0.55;
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  };
  const reflector = new Reflector(new THREE.PlaneGeometry(W, H), {
    textureWidth: 256, textureHeight: 256, clipBias: 0.003, shader: WaterShader, multisample: 0,
  });
  reflector.rotation.x = -Math.PI / 2;
  reflector.position.set(W / 2, 0.005, H / 2);
  reflector.material.uniforms.tWater.value = waterT;
  diorama.add(reflector);
  {
    const orig = reflector.onBeforeRender.bind(reflector);
    let n = 0;
    reflector.onBeforeRender = (r, sc, cam) => {
      if (!hq) return;
      if (touch && (n++ & 1)) return; // phones: the mirror refreshes every other frame
      noReflect.visible = false; floatGroup.visible = false;
      orig(r, sc, cam);
      noReflect.visible = hq; floatGroup.visible = true;
    };
  }

  /* ------------------------------------------------------- actors (billboards) */
  const frameTexs = new Map();
  const frameTex = (sheet, frame, flip) => {
    const key = sheet + ':' + frame + ':' + (flip ? 1 : 0);
    let t = frameTexs.get(key);
    if (!t) { const r = S.frameRect(sheet, frame); t = rectTex(r.img, r.sx, r.sy, r.w, r.h, flip); frameTexs.set(key, t); }
    return t;
  };
  const blobTex = soft(64, [[0, 'rgba(0,0,0,0.7)'], [0.55, 'rgba(0,0,0,0.35)'], [1, 'rgba(0,0,0,0)']]);
  const views = S.actors.map((a) => {
    const w = a.def.w / T, h = a.def.h / T;
    const mat = new THREE.MeshLambertMaterial({ map: frameTex(a.sheet, 0, false), alphaTest: 0.5, side: THREE.DoubleSide, emissive: 0xffffff, emissiveIntensity: 0 });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h).translate(0, h / 2, 0), mat);
    mesh.scale.y = 1.12;
    mesh.castShadow = true;
    const blob = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 0.5).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false }));
    blob.position.y = 0.025;
    blob.renderOrder = 1;
    scene.add(mesh, blob);
    return { a, mesh, blob, mat };
  });

  /* ------------------------------------------------------ (4) chest and loot */
  const chestFrames = [0, 1, 2, 3].map((i) => rectTex(S.img.chests, i * 16, 16, 16, 16, false)); // the golden chest, row 2
  const chestMat = new THREE.MeshLambertMaterial({ map: chestFrames[0], alphaTest: 0.5, side: THREE.DoubleSide });
  const chestMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).translate(0, 0.5, 0), chestMat);
  chestMesh.position.set(S.chest.x + 0.5, 0, S.chest.y + 0.6);
  chestMesh.scale.y = 1.1;
  chestMesh.castShadow = true;
  scene.add(chestMesh);
  const itemTex = rectTex(S.img.items, (19 % 16) * 16, Math.floor(19 / 16) * 16, 16, 16, false); // crystals
  const itemMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62), new THREE.MeshBasicMaterial({ map: itemTex, alphaTest: 0.5, side: THREE.DoubleSide, toneMapped: false, color: new THREE.Color(1.5, 1.4, 1.7) }));
  itemMesh.visible = false;
  scene.add(itemMesh);

  /* ------------------------------------------------------------------ lights */
  const ambient = new THREE.AmbientLight(0x6878b8, 2.7);
  scene.add(ambient);
  // The torch is the one light that casts shadows.
  const torchTexs = [];
  for (let i = 0; i < S.TORCH_FRAMES; i++) {
    const t = pix(S.img.ambient);
    t.repeat.set(16 / S.img.ambient.width, 16 / S.img.ambient.height);
    t.offset.set((i * 16) / S.img.ambient.width, 1 - 16 / S.img.ambient.height);
    torchTexs.push(t);
  }
  const torchMat = new THREE.MeshBasicMaterial({ map: torchTexs[0], alphaTest: 0.1, toneMapped: false, color: new THREE.Color(2.6, 2.2, 1.8) });
  const torchMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), torchMat);
  torchMesh.position.set(TORCH_X, 0.62, 1.012);
  scene.add(torchMesh);
  const torchLight = new THREE.PointLight(0xff9448, 13, 0, 1.2);

    },
    tap: (x, y) => {
      audio(); askTilt();
      if (photo) return;
      ray.setFromCamera(new THREE.Vector2((x / vw) * 2 - 1, -((y / vh) * 2 - 1)), camera);
      if (ray.intersectObject(chestMesh, false).length) { S.tapChest(); return; }
      const p = ground(x, y);
      if (!p) return;
      const cx = Math.floor(p.x), cz = Math.floor(p.z);
      if (S.chest && cx === S.chest.x && cz === S.chest.y) S.tapChest();
      else S.tapCell(cx, cz);
    },
    hover: (x, y) => { if (!tiltBase && !photo) { tilt.ty = ((x / vw) - 0.5) * 2 * 0.11; tilt.tp = ((y / vh) - 0.5) * 2 * -0.05; } },
  });

  /* ---------------------------------------------------------------- post */
  const sampleCount = () => (!hq ? 0 : touch ? 2 : 4);
  const rt = new THREE.WebGLRenderTarget(vw * pr, vh * pr, { type: THREE.HalfFloatType, samples: sampleCount() });
  const composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(pr);
  composer.setSize(vw, vh);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(vw / 2, vh / 2), 0.4, 0.5, 1.3);
  composer.addPass(bloom);

  /** Depth of field (a tilt-shift band that follows the hero, or the target of a fireball), grading filters and a vignette; the blur is made at reduced resolution. */
  class DofPass extends Pass {
    constructor(scale) {
      super();

      this.blurRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: false });
      const vert = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }';
      this.blurMat = new THREE.ShaderMaterial({
        uniforms: { tDiffuse: { value: null }, res: { value: new THREE.Vector2(1, 1) }, radius: { value: 4 } },
        vertexShader: vert,
        fragmentShader: `
          uniform sampler2D tDiffuse; uniform vec2 res; uniform float radius; varying vec2 vUv;
          void main() {
            vec3 sum = texture2D(tDiffuse, vUv).rgb; float n = 1.0;
            for (int i = 0; i < 12; i++) {
              float a = float(i) * 2.399963, r = sqrt((float(i) + 0.5) / 12.0) * radius;
              sum += texture2D(tDiffuse, vUv + vec2(cos(a), sin(a)) * r / res).rgb; n += 1.0;

        depthTest: false, depthWrite: false,
      });

        uniforms: { tDiffuse: { value: null }, tBlur: { value: null }, focus: { value: 0.45 }, boost: { value: 1 }, useDof: { value: 1 }, vig: { value: 0.5 }, filt: { value: 0 }, time: { value: 0 }, res: { value: new THREE.Vector2(1, 1) } },
        vertexShader: vert,
        fragmentShader: `
          uniform sampler2D tDiffuse, tBlur; uniform float focus, boost, useDof, vig, filt, time; uniform vec2 res; varying vec2 vUv;
          float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
          void main() {
            vec4 sharp = texture2D(tDiffuse, vUv); vec3 col = sharp.rgb;
            vec3 bl = texture2D(tBlur, vUv).rgb;
            float m = smoothstep(0.1, 0.55, abs(vUv.y - focus)) * boost * useDof;
            if (filt > 2.5) m = max(m, 0.4);
            col = mix(col, bl, clamp(m, 0.0, 1.0));
            if (filt > 0.5 && filt < 1.5) { col *= vec3(1.1, 1.0, 0.84); }
            else if (filt > 1.5 && filt < 2.5) {

        depthTest: false, depthWrite: false,
      });

    }
    setSize(w, h) {
      const bw = Math.max(1, Math.round(w * this.scale)), bh = Math.max(1, Math.round(h * this.scale));
      this.blurRT.setSize(bw, bh);
      this.blurMat.uniforms.res.value.set(bw, bh);
      this.blurMat.uniforms.radius.value = Math.max(2, bh / 150);
      this.mixMat.uniforms.res.value.set(w, h);
    }
    render(renderer, writeBuffer, readBuffer) {
      const u = this.mixMat.uniforms;

      u.tDiffuse.value = readBuffer.texture;
      u.tBlur.value = needBlur ? this.blurRT.texture : readBuffer.texture;

  const dofScale = touch ? 0.5 : 1;
  const bloomScale = touch ? 0.5 : 1;
  const dof = new DofPass(dofScale);
  composer.addPass(dof);
  composer.addPass(new OutputPass());
  const dofU = dof.mixMat.uniforms;

  const refScale = touch ? 0.35 : 0.5;
  function applySize(p) {
    cp = p;
    renderer.setPixelRatio(p);
    renderer.setSize(vw, vh);
    composer.setPixelRatio(p);
    composer.setSize(vw, vh);
    bloom.setSize(vw * p * bloomScale, vh * p * bloomScale);
    reflector.getRenderTarget().setSize(Math.max(64, Math.round(vw * p * refScale)), Math.max(64, Math.round(vh * p * refScale)));
    camera.aspect = vw / vh;
    camera.updateProjectionMatrix();
    fit(); placeCamera();
  }
  function setMSAA() {
    [composer.renderTarget1, composer.renderTarget2].forEach((t) => { t.samples = sampleCount(); t.dispose(); });
  }
  /** The quality toggle: low turns off the mirror, the fog and mist, depth of field and MSAA. */
  function applyQuality() {
    reflector.visible = hq;
    noReflect.visible = hq;
    dof.dof = hq;
    setMSAA();
    hud.setInfo((renderer.capabilities.isWebGL2 ? 'WebGL2' : 'WebGL1') + ' · ' + pr + 'x' + (touch ? ' · touch' : '') + (hq ? '' : ' · low'));
  }
  window.addEventListener('resize', () => { vw = window.innerWidth; vh = window.innerHeight; applySize(cp); });
  applySize(pr);
  applyLight();
  applyQuality();
  setMSAA();

  /* ------------------------------------------------------- (3) fireball */
  function castFire() {
    audio();
    if (photo) return;
    const r = S.castFireball();
    if (r === -1) hud.toast('Нет целей в поле зрения', '#9fd0ff');
  }

  /* ---------------------------------------------------------- (5) photo mode */
  const filters = [['Без', 0], ['Тёплый', 1], ['Ч/Б', 2], ['Мечта', 3]];
  const rowEl = document.getElementById('ph-filters');
  const chipEls = filters.map(([label, id]) => {
    const b = document.createElement('button');
    b.className = 'ph-btn'; b.type = 'button'; b.textContent = label;
    b.addEventListener('click', () => setFilter(id));
    rowEl.appendChild(b);
    return b;
  });
  const bloomDef = { s: 0.4, r: 0.5, t: 1.3 };
  function setFilter(id) {
    filterMode = id;
    dofU.filt.value = id;
    chipEls.forEach((b, i) => b.setAttribute('aria-pressed', filters[i][1] === id ? 'true' : 'false'));
    const dreamy = id === 3;
    bloom.strength = dreamy ? 0.95 : bloomDef.s; bloom.radius = dreamy ? 0.9 : bloomDef.r; bloom.threshold = dreamy ? 0.75 : bloomDef.t;
  }
  let zoomBefore = 1;
  function enterPhoto() {
    audio();
    if (photo) return;
    photo = true; S.paused = true;
    zoomBefore = view.zoom;
    tilt.ty = tilt.tp = tilt.y = tilt.p = 0;
    orbit.yaw = orbit.pitch = 0;
    document.body.classList.add('pd-photo');
    setFilter(0);
    placeCamera();
  }
  function exitPhoto() {
    if (!photo) return;
    photo = false; S.paused = false;
    orbit.yaw = orbit.pitch = 0;
    view.zoom = zoomBefore;
    document.body.classList.remove('pd-photo');
    setFilter(0);
    placeCamera();
  }
  document.getElementById('ph-exit').addEventListener('click', exitPhoto);
  const shot = document.getElementById('ph-shot'), shotImg = document.getElementById('ph-img'), shotDl = document.getElementById('ph-dl'), shotShare = document.getElementById('ph-share');
  let shotUrl = null, shotBlob = null;
  function save() {
    // One more frame at twice the pixel density if the GPU allows it, read straight away.
    const want = Math.min(2, Math.floor(renderer.capabilities.maxTextureSize / Math.max(vw, vh)));
    const target = Math.max(pr, want);
    const big = target !== cp;
    if (big) applySize(target);
    draw(0);
    renderer.domElement.toBlob((blob) => {
      if (big) applySize(pr);
      draw(0);
      if (!blob) { hud.toast('Не удалось сделать снимок'); return; }
      if (shotUrl) URL.revokeObjectURL(shotUrl);
      shotBlob = blob;
      shotUrl = URL.createObjectURL(blob);
      shotImg.src = shotUrl;
      shotDl.href = shotUrl;
      shotShare.style.display = (navigator.canShare && navigator.canShare({ files: [new File([blob], 'pixel-dungeon.png', { type: 'image/png' })] })) ? '' : 'none';
      shot.style.display = 'flex';
    }, 'image/png');
  }
  document.getElementById('ph-save').addEventListener('click', save);
  document.getElementById('ph-close').addEventListener('click', () => { shot.style.display = 'none'; });
  shotShare.addEventListener('click', () => {
    if (shotBlob) navigator.share({ files: [new File([shotBlob], 'pixel-dungeon.png', { type: 'image/png' })] }).catch(() => {});
  });

  /* -------------------------------------------------------------- one frame */
  const projected = new THREE.Vector3();
  const hide = (list, from) => { for (let i = from; i < list.length; i++) list[i].visible = false; };
  const ripUniform = reflector.material.uniforms.rip.value;

  function draw(dt) {
    let i;
    if (!S.paused) clock += dt;
    const now = clock;
    const sdt = S.paused ? 0 : (dt * S.timeScale) / 1000;
    S.events.splice(0).forEach(handleEvent);

    // Camera: parallax eases to its target, shake on top.
    const k = Math.min(1, dt / 120);
    tilt.y += (tilt.ty - tilt.y) * k; tilt.p += (tilt.tp - tilt.p) * k;
    shake = shake > 0.002 ? 0.34 * Math.exp(-(now - shakeT) / 160) : 0;
    if (shake > 0 || tilt.y !== 0 || tilt.p !== 0 || Math.abs(tilt.ty - tilt.y) > 1e-4) placeCamera();
    if (shake > 0) {
      camera.position.x += rnd(-shake, shake); camera.position.y += rnd(-shake, shake) * 0.6; camera.position.z += rnd(-shake, shake);
      camera.lookAt(view.tx, 0, view.tz);
      camera.updateMatrixWorld(true);
    }

    // Actors.
    for (i = 0; i < views.length; i++) {
      const v = views[i], a = v.a;
      v.mat.map = frameTex(a.sheet, a.frame, a.flip);
      v.mat.emissiveIntensity = a.flash * 0.9;
      v.mesh.position.set(a.x, 0, a.y + 0.12);
      v.mesh.rotation.y = camYaw;
      v.blob.position.set(a.x, 0.025, a.y + 0.12);
      v.blob.visible = !a.dead;
    }
    planted.forEach((m) => { m.rotation.y = camYaw; });
    chestMesh.rotation.y = camYaw;
    doorMat.map = S.doorOpen ? doorOpen : doorClosed;
    const c = S.chest;
    chestMat.map = chestFrames[c.open ? Math.min(3, 1 + Math.floor(c.t / 110)) : 0];

    // Fog of war and the shared shader uniforms.
    explore();
    const tf = S.torch;
    fx.time.value = S.time / 1000;
    fx.torchI.value = tf.f;
    fx.heroPos.value.set(S.hero.x, 0.5, S.hero.y);
    waterT.offset.y = (S.time / 200 / 32) % 1;
    reflector.material.uniforms.time.value = S.time / 1000;

    // Torch.
    torchMat.map = torchTexs[tf.frame];
    torchLight.intensity = 13 * tf.f * tf.f;
    torchLight.position.set(TORCH_X + (tf.noise - 1) * 0.15, 0.7, 1.45);
    flameGlow.material.opacity = 0.4 * tf.f;
    flameGlow.visible = postOn || lightOn;
    heroLight.position.set(S.hero.x, 1.7, S.hero.y + 0.9);
    for (i = 0; i < S.sparks.length && i < sparkSprites.length; i++) {
      const s = S.sparks[i], sp = sparkSprites[i];
      sp.visible = true; sp.position.set(s.x + (TORCH_X - 8.5), s.h, 1.05); sp.scale.setScalar(0.07);
      sp.material.opacity = 1 - s.age / s.life;
    }
    hide(sparkSprites, S.sparks.length);

    // God ray: a slow breath, dust in the cone.
    const tsec = S.time / 1000;
    godMat.uniforms.uI.value = 0.2 * (0.9 + 0.1 * Math.sin(tsec * 0.7));
    pool.material.opacity = 0.9 + 0.1 * Math.sin(tsec * 0.7);
    for (i = 0; i < DUST; i++) {
      const d = dust[i];
      d.t -= d.sp * sdt; if (d.t < 0) d.t += 1;
      d.a += d.da * sdt;
      const r = (1.15 + (0.55 - 1.15) * d.t) * 0.9 * d.r + Math.sin(tsec * 0.9 + d.ph) * 0.05;
      dustPos[i * 3] = Math.cos(d.a) * r; dustPos[i * 3 + 1] = d.t * BEAM.h; dustPos[i * 3 + 2] = Math.sin(d.a) * r;
      const tw = (0.5 + 0.5 * Math.sin(tsec * 1.7 + d.ph)) * Math.min(1, d.t * 6) * Math.min(1, (1 - d.t) * 5);
      dustCol[i * 3] = 0.8 * tw; dustCol[i * 3 + 1] = 0.9 * tw; dustCol[i * 3 + 2] = 1.0 * tw;
    }

    // Drips, ripples (also the rings made by wading), mist.
    for (i = 0; i < S.drops.length && i < dropSprites.length; i++) {
      const d = S.drops[i], sp = dropSprites[i];
      sp.visible = true; sp.position.set(d.x, d.h + 0.02, d.y + 0.03); sp.scale.set(0.05, 0.1, 1);
    }
    hide(dropSprites, S.drops.length);
    let rn = 0, rl = 0;
    for (i = 0; i < S.ripples.length; i++) {
      const r = S.ripples[i];
      if (r.age < 0) continue;
      const p = r.age / r.life;
      if (rn < rippleMeshes.length) {
        const m = rippleMeshes[rn++];
        m.visible = true; m.position.set(r.x, 0.03, r.y);

        m.material.opacity = (1 - p) * (r.tap ? 0.7 : 0.9);
        m.material.color.set(r.tap ? 0xffffff : 0xcfe9ff);
      }
      // The same rings wobble the mirror (only those over water).
      if (!r.tap && rl < 8 && S.isWater(Math.floor(r.x), Math.floor(r.y))) ripUniform[rl++].set(r.x, r.y, 0.12 + p * (r.big ? 0.95 : 0.7), (1 - p) * (r.big ? 1 : 0.7));
    }
    hide(rippleMeshes, rn);
    for (; rl < 8; rl++) ripUniform[rl].w = 0;
    for (i = 0; i < S.mist.length; i++) {
      const m = S.mist[i], s = mistSprites[i];
      s.position.set(m.x, 0.28 + 0.06 * Math.sin(S.time / 1300 + m.ph), m.y);
      s.material.opacity = 0.08 * m.a * (0.7 + 0.3 * Math.sin(S.time / 1500 + m.ph));
    }

    // Fireball in flight: core, moving light, trail.
    const f = S.fire;
    let fLight = 0;
    if (f) {
      fireCore.visible = true;
      fireCore.position.set(f.x, 0.78, f.y);
      const fl = 0.85 + 0.15 * Math.sin(now / 35) + rnd(-0.05, 0.05);
      fireCore.scale.setScalar(0.85 * fl);
      fireLight.position.set(f.x, 0.8, f.y);
      fLight = 15 * fl;
      if (sdt > 0) sparks(f.x - (f.dx || 0) * 0.2, 0.75, f.y - (f.dy || 0) * 0.2, 2, { v0: 0.2, v1: 1.0, u0: 0, u1: 0.8, g: -1.5, l0: 250, l1: 500, s: 0.1, color: [0xffd070, 0xff8a2a] });
    } else fireCore.visible = false;

    // Explosion: a flash that lights the whole room for about 200 ms, and a shock ring.
    if (boom) {
      const bt = now - boom.t0;
      if (bt > 700) { boom = null; boomFlash.visible = false; shock.visible = false; renderer.toneMappingExposure = 1; }
      else {
        fireLight.position.set(boom.x, 0.9, boom.z);
        fireLight.distance = 40;
        fLight = 420 * Math.exp(-bt / 70);
        renderer.toneMappingExposure = 1 + 1.1 * Math.exp(-bt / 80);
        boomFlash.visible = bt < 300;
        boomFlash.position.set(boom.x, 0.7, boom.z);
        boomFlash.scale.setScalar(1.2 + bt / 45);
        boomFlash.material.opacity = Math.max(0, 1 - bt / 280);
        shock.visible = bt < 450;
        shock.position.set(boom.x, 0.05, boom.z);
        shock.scale.setScalar(0.4 + bt / 110);
        shock.material.opacity = Math.max(0, 1 - bt / 450) * 0.8;
      }
    } else fireLight.distance = 14;
    fireLight.intensity = fLight;

    // Chest: a burst of light, then the loot glow; the item's arc, its beam and ring.
    let lootI = 0;
    const cb = chestBurst < 0 ? 1e9 : now - chestBurst;
    if (cb < 800) {
      chestStar.visible = true;
      chestStar.position.set(S.chest.x + 0.5, 0.75, S.chest.y + 0.7);
      chestStar.scale.setScalar(0.8 + cb / 160);
      chestStar.material.opacity = Math.max(0, 1 - cb / 650);
      chestStar.material.rotation = cb / 500;
      lootLight.color.set(0xffd27a); lootLight.position.set(S.chest.x + 0.5, 1.1, S.chest.y + 0.9);
      lootI = 40 * Math.pow(Math.max(0, 1 - cb / 700), 2);
      lootLight.distance = 12;
    } else chestStar.visible = false;
    const it = S.item;
    if (it && it.state !== 'taken' || (it && it.takenT < 450)) {
      itemMesh.visible = true;
      const bob = it.state === 'ground' ? 0.05 * Math.sin(now / 260) : 0;
      itemMesh.position.set(it.x, it.h + 0.3 + bob, it.y + 0.05);
      itemMesh.rotation.y = camYaw;
      const tk = it.state === 'taken' ? it.takenT / 450 : 0;
      itemMesh.scale.setScalar(1 + tk * 1.2);
      itemMesh.material.opacity = 1;
      itemMesh.visible = tk < 1;
      const beamOn = it.state === 'ground' || it.state === 'taken';
      const appear = it.state === 'ground' ? Math.min(1, it.t / 350) : it.state === 'taken' ? 1 - Math.min(1, it.takenT / 350) : 0;
      lootBeam.visible = beamOn && appear > 0.01;
      lootBeam.position.set(it.x, 0, it.y + 0.05);
      lootBeam.scale.set(1, Math.max(0.01, appear), 1);
      lootMat.uniforms.uA.value = appear;
      lootGlow.visible = it.state !== 'arc';
      lootGlow.position.set(it.x, 0.35, it.y + 0.1);
      lootGlow.scale.setScalar(1.3 * (1 + 0.1 * Math.sin(now / 200)));
      lootGlow.material.opacity = appear * 0.8;
      lootRing.visible = beamOn && appear > 0.01;
      lootRing.position.set(it.x, 0.05, it.y + 0.05);
      lootRing.scale.setScalar(1.2 + 0.18 * Math.sin(now / 300));
      lootRing.material.opacity = appear * 0.7;
      if (cb >= 800) { lootLight.color.set(0xb060ff); lootLight.position.set(it.x, 0.8, it.y + 0.2); lootLight.distance = 7; }
      if (it.state === 'ground') {
        lootI = Math.max(lootI, 3.2 * (0.85 + 0.15 * Math.sin(now / 240)));
        if (sdt > 0 && Math.random() < 0.12) spawn(burstPool, { x: it.x + rnd(-0.18, 0.18), y: 0.1, z: it.y + rnd(-0.18, 0.18), vx: 0, vz: 0, vy: rnd(0.8, 1.6), life: rnd(900, 1500), s0: 0.07, s1: 0.02, color: 0xd9a8ff, fade: 1 });
      }
      if (it.state === 'taken') lootI = Math.max(lootI, 3.2 * appear);
    } else {
      itemMesh.visible = false; lootBeam.visible = false; lootGlow.visible = false; lootRing.visible = false;
    }
    lootLight.intensity = lootI;

    stepParts(sdt);

    // Floating damage numbers.
    const alive = new Set(S.floaters);
    floatSprites.forEach((sp, fl) => { if (!alive.has(fl)) { floatGroup.remove(sp); sp.material.dispose(); floatSprites.delete(fl); } });
    S.floaters.forEach((fl) => {
      let sp = floatSprites.get(fl);
      if (!sp) {
        sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: textTex(fl.text, fl.color), transparent: true, depthTest: false, depthWrite: false, toneMapped: false, fog: false }));
        sp.renderOrder = 20;
        floatGroup.add(sp);
        floatSprites.set(fl, sp);
      }
      const p = fl.age / fl.life, grow = (1 + Math.max(0, 0.3 - p)) * (fl.big ? 1.35 : 1);
      sp.position.set(fl.x, 1.25 + p * 0.8, fl.y + 0.5);
      sp.material.opacity = p < 0.6 ? 1 : 1 - (p - 0.6) / 0.4;
      sp.scale.set(0.62 * grow * sp.material.map.userData.aspect, 0.62 * grow, 1);
    });

    // Depth of field: focus on the hero, or on the fireball's target for a moment.
    const focusing = now < dofUntil && dofTarget;
    const fa = focusing ? dofTarget : S.hero;
    projected.set(fa.x, 0.4, fa.y).project(camera);
    dofU.focus.value += ((projected.y * 0.5 + 0.5) - dofU.focus.value) * Math.min(1, dt / (focusing ? 60 : 200));
    dofU.boost.value += ((focusing ? 2.6 : 1) - dofU.boost.value) * Math.min(1, dt / 80);
    dofU.time.value = S.time / 1000;
    dofU.vig.value = filterMode === 2 ? 0.55 : 0.5;

    if (postOn || photo) composer.render(dt / 1000);
    else renderer.render(scene, camera);
  }

  S.run(draw);
  draw(16);
  window.__dbg = () => ({ boom, parts: parts.length, clock, fl: fireLight.intensity, fd: fireLight.distance, fv: fireLight.visible, flash: boomFlash.visible, shake });
  window.__three = { renderer, scene, camera, view, orbit, S, hud, setFilter, enterPhoto, exitPhoto, castFire, applyQuality, get hq() { return hq; }, set hq(v) { hq = v; applyQuality(); } };
} catch (err) {
  S.fatal(err);
}
</script>
