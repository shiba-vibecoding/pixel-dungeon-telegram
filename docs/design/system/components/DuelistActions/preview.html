<!-- @dsCard group="Клирик и Дуэлянтка" height=852 width=1572 page subtitle="Кнопка способности оружия над панелью справа, как кнопка комбо: оружие ×2, заряды числом. Готова — фиолетовая; копит — серая, оружие тусклое, полоска заряда; прицеливание — золотая рамка мигает, уголки прицела, подсказка «Выберите цель». Чемпион — вторая кнопка: два слота оружия и стрелки смены. Монах — свои 5 приёмов с ценой в энергии" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Кнопки Дуэлянтки</title>
<style>
  html, body { margin: 0; background: var(--void); }
  .row { display: flex; gap: 24px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 8px; flex: none; }
  .cap { margin: 0; height: 20px; font: var(--text-caption, 400 15px/20px var(--font-small)); color: var(--ink-muted); }
  .cap b { color: var(--gold); font-weight: 400; }
  .phone { position: relative; overflow: hidden; --safe-t: 0px; --safe-b: 34px; flex: none; }
</style></head>
<body>
<div class="pd-root row" id="row"></div>
<script>
  var q = new URLSearchParams(location.search), L = q.get('lang') || 'ru', en = L === 'en';
  function phone(w, h, cap) { var c = document.createElement('div'); c.className = 'col'; c.innerHTML = '<p class="cap">' + (cap || '') + '</p>'; var p = document.createElement('div'); p.className = 'phone pd-phone'; p.style.width = w + 'px'; p.style.height = h + 'px'; c.appendChild(p); document.getElementById('row').appendChild(c); return p; }
  function game(p) { var g = document.createElement('div'); g.style.cssText = 'position:absolute;inset:0'; p.appendChild(g); PD.demo.game(g); return g; }
  function gm(p, o) { o = o || {}; o.mates = false; o.noMobs = true; o.depth = o.depth || 12; PD.demo.game(p, o); return p; }
  var a = gm(phone(375, 812, en ? '<b>Ready</b> · Champion with two weapons' : '<b>Готова</b> · Чемпион с двумя оружиями'), { av: 4 }); PD.demo.placeActind(a, PD.demo.actind(L, 'weapon', { n: 2, sitem: 99 })); PD.demo.placeActind(a, PD.demo.actind(L, 'swap', { main: 99, spare: 128 }), 2);
  var b = gm(phone(375, 812, en ? '<b>Charging</b> · no charges yet' : '<b>Копит заряд</b> · зарядов нет'), { av: 4 }); PD.demo.placeActind(b, PD.demo.actind(L, 'charging', { v: .4, sitem: 99 }));
  var c = gm(phone(375, 812, en ? '<b>Aiming</b> · pick a target' : '<b>Прицеливание</b> · выберите цель'), { av: 4 }); PD.demo.placeActind(c, PD.demo.actind(L, 'aiming', { n: 1, sitem: 99 })); var t = document.createElement('div'); t.className = 'pd-aim-toast'; t.innerHTML = PD.demo.v22[L].ab.aimHint + '<button class="pd-button small quiet">' + PD.demo.v22[L].ab.cancel + '</button>'; c.appendChild(t);
  var d = gm(phone(375, 812, en ? '<b>Monk</b> · 3 energy' : '<b>Монах</b> · 3 энергии'), { av: 4 }); PD.demo.placeActind(d, PD.demo.actind(L, 'monk', { n: 3 })); PD.demo.overlay(d, PD.demo.win.monk(L, { energy: 3 }));
  PD.sprite(document.body);
</script>
</body>
</html>
