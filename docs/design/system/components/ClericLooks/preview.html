<!-- @dsCard group="Клирик и Дуэлянтка" height=852 width=1572 page subtitle="Союзник света — плоский тёплый силуэт героя (255, 250, 200) с прозрачностью 0,85 и ореолом; усиленный «силой многих» союзник светлеет и пульсирует 4 раза в секунду; остаточный образ Дуэлянтки — её спрайт с прозрачностью 0,6, тает за 3 с ступенями; заклинания над героем — один лист из 9 кадров. Значки состояний Клирика в HUD и окно состояния" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Свет и образы</title>
<style>
  html, body { margin: 0; background: var(--void); }
  .row { display: flex; gap: 24px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 8px; flex: none; }
  .cap { margin: 0; height: 20px; font: var(--text-caption, 400 15px/20px var(--font-small)); color: var(--ink-muted); }
  .cap b { color: var(--gold); font-weight: 400; }
  .phone { position: relative; overflow: hidden; --safe-t: 0px; --safe-b: 34px; flex: none; }
</style></head>
<body>
<div class="pd-root row" id="row"></div>
<script>
  var q = new URLSearchParams(location.search), L = q.get('lang') || 'ru', en = L === 'en';
  function phone(w, h, cap) { var c = document.createElement('div'); c.className = 'col'; c.innerHTML = '<p class="cap">' + (cap || '') + '</p>'; var p = document.createElement('div'); p.className = 'phone pd-phone'; p.style.width = w + 'px'; p.style.height = h + 'px'; c.appendChild(p); document.getElementById('row').appendChild(c); return p; }
  function game(p) { var g = document.createElement('div'); g.style.cssText = 'position:absolute;inset:0'; p.appendChild(g); PD.demo.game(g); return g; }
  function gm(p, o) { o = o || {}; o.mates = false; o.noMobs = true; o.depth = o.depth || 12; PD.demo.game(p, o); return p; }
  var a = gm(phone(375, 812, en ? '<b>Light ally</b> and an empowered ally' : '<b>Союзник света</b> и усиленный союзник')); PD.demo.heroFx(a, { scene: 'light' }); PD.demo.clericBuffs(a, ['many', 'ascend']);
  var b = gm(phone(375, 812, en ? '<b>Afterimage</b> · fades in 3 s' : '<b>Остаточный образ</b> · тает за 3 с')); PD.demo.heroFx(b, { scene: 'afterimage' });
  var c = gm(phone(375, 812, '<b>' + (en ? 'Over the hero' : 'Над героем') + '</b> · <span class="now"></span>')); PD.demo.heroFx(c, { scene: 'spell', cls: 5, lang: L, label: c.parentNode.querySelector('.now') });
  var d = gm(phone(375, 812, en ? '<b>Cleric buffs</b> · Power of many' : '<b>Состояния Клирика</b> · сила многих')); PD.demo.clericBuffs(d, ['ascend', 'many', 'body', 'mind', 'spirit', 'wall', 'hallowed']); PD.demo.overlay(d, PD.demo.win.clericBuff(L, 'many', 34));
  PD.sprite(document.body);
</script>
</body>
</html>
