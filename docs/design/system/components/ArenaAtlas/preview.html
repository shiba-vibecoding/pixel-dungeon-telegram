<!doctype html>
<html>
<head><meta charset="utf-8"><title>Атлас арены</title>
<style>
  html, body { margin: 0; background: var(--void); }

  td.r { font: var(--text-label, 400 18px/20px var(--font-ui)); color: var(--gold); padding-right: 8px; white-space: nowrap; }

  .icons { display: flex; gap: 20px; align-items: flex-end; }

</style></head>
<body>
<div class="pd-root wrap">
  <table id="t"><tr><th></th><th>gate</th><th>brazier</th><th>banner</th><th>sand</th><th>crowd</th></tr></table>
  <div class="notes" id="n"></div>
  <div class="icons">
    <div class="ic"><img src="/_blob/8c6337f32cc97405228253383a22df74" width="64" height="64"><span>arena-icon.png · режим</span></div>
    <div class="ic"><img src="/_blob/f4f317bee406899af6fad5202f939863" width="64" height="64"><span>Волна 5 · бронза</span></div>
    <div class="ic"><img src="/_blob/0fe192379f7061ee02ce3b4c04343825" width="64" height="64"><span>Волна 10 · серебро</span></div>
    <div class="ic"><img src="/_blob/b246f03bde0d6649d5ed620f53b89806" width="64" height="64"><span>Волна 20 · золото</span></div>
  </div>
</div>
<script>
  var A = {"gate": {"f": [[0, 0, 0], [16, 0, 90], [32, 0, 90], [48, 0, 0]], "n": "тайл стены с аркой; кадр 0 — закрыто (стоит), 3 — открыто (стоит); опускается в обратном порядке, по 70 мс"}, "brazier": {"f": [[0, 16, 110], [16, 16, 110], [32, 16, 110], [48, 16, 110]], "n": "ставится поверх песка; свет в ×1.5 клетки — light.png окраской огня"}, "banner": {"f": [[0, 32, 600], [16, 32, 600]], "n": "по кругу, сдвиг фазы по клетке"}, "sand": {"f": [[0, 48, 0], [16, 48, 0], [32, 48, 0], [48, 48, 0], [64, 48, 0], [80, 48, 0]], "n": "вместо EMPTY внутри круга; простые варианты по хэшу клетки, кровь и царапины — редко"}, "crowd": {"f": [[0, 64, 0], [16, 64, 160], [32, 64, 160]], "n": "после волны: 1,2,1,2… 2 с, потом кадр 0; в передышке изредка 1"}}, URLS = {"tiles": ["/_blob/1017d572096e2700056c3073ee1b1f70", "/_blob/bbf6fb72265a42c71d1ca569ed6ec74c", "/_blob/c6a560589817de1d39bacee1fa94555b", "/_blob/9a817e0b018e7697fe08b67243804bbc", "/_blob/e2dbe83d50ed7393cc2ea24addcabd9e"], "atlas": ["/_blob/39187c520dfb62a50ae0eceff6ebcb54", "/_blob/33cceae13a77e0c215213eca8055b549", "/_blob/b1c93fc7045b8b8bca207fd2e00cf8fb", "/_blob/6b58587cc0a09ffce7cb3fab72b1ba4c", "/_blob/ccbbe6e62960188b3bfcd5b8417fadf8"], "mobA": "/_blob/f7e2262ad6166dce257c275e7ce2b0bf", "mobB": "/_blob/555788d1c964401e157ce3e1d8ea645e"}, REG = ['Канализация', 'Тюрьма', 'Пещеры', 'Город гномов', 'Демонические залы'], cells = [];
  var K = ['gate', 'brazier', 'banner', 'sand', 'crowd'], S = 3;
  var ims = URLS.atlas.map(function (u) { var i = new Image(); i.src = u; return i; });
  var t = document.getElementById('t');
  REG.forEach(function (name, r) {
    var tr = document.createElement('tr'); tr.innerHTML = '<td class="r">' + name + '</td>'; t.appendChild(tr);
    K.forEach(function (k) { var td = document.createElement('td'), c = document.createElement('canvas'), n = k === 'sand' ? 3 : 1; c.width = 16 * S * n + (n - 1) * 4; c.height = 16 * S; td.appendChild(c); tr.appendChild(td); cells.push({ g: c.getContext('2d'), r: r, k: k, n: n, w: c.width }); });
  });
  document.getElementById('n').innerHTML = K.map(function (k) { return '<span><b>' + k + '</b> · ' + A[k].f.map(function (f) { return f[2] || 'стоп'; }).join(' · ') + ' мс. ' + A[k].n + '</span>'; }).join('');
  function pick(fr, t, k) { if (k === 'gate') { var seq = [0, 1, 2, 3, 3, 3, 2, 1, 0, 0], d = [700, 90, 90, 700, 1, 1, 70, 70, 700, 1]; var tot = 2423, tt = t % tot; for (var i = 0; i < seq.length; i++) { if (tt < d[i]) return seq[i]; tt -= d[i]; } return 0; }
    if (k === 'crowd') { var tt2 = t % 2400; return tt2 < 1200 ? 0 : (Math.floor(tt2 / 160) % 2 ? 1 : 2); }
    var tot2 = fr.reduce(function (a, f) { return a + (f[2] || 400); }, 0), t3 = t % tot2; for (var j = 0; j < fr.length; j++) { var m = fr[j][2] || 400; if (t3 < m) return j; t3 -= m; } return 0; }
  Promise.all(ims.map(function (i) { return i.complete ? 1 : new Promise(function (ok) { i.onload = ok; }); })).then(function () {
    var t0 = performance.now();
    (function loop(now) { var t = now - t0; cells.forEach(function (c) { c.g.imageSmoothingEnabled = false; c.g.clearRect(0, 0, c.w, 48); var fr = A[c.k].f;
      if (c.k === 'sand') { for (var i = 0; i < 3; i++) { var f = fr[[0, 3, 5][i]]; c.g.drawImage(ims[c.r], f[0], f[1], 16, 16, i * (48 + 4), 0, 48, 48); } return; }
      var f2 = fr[pick(fr, t, c.k)]; c.g.drawImage(ims[c.r], f2[0], f2[1], 16, 16, 0, 0, 48, 48); }); requestAnimationFrame(loop); })(t0);
  });
</script>
