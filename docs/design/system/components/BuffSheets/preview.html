<!-- @dsCard group="Клирик и Дуэлянтка" height=940 width=1100 subtitle="Состояния и заклинания: Клирик (вознесение, сила многих, три формы — треугольник Троицы красным, синим, зелёным, стена света, освящённая земля); таланты — значки Shattered с оттенком hardlight из Talent.java; комбо — кадр 17 buffs.png с оттенком лучшего приёма (кнопка — кадр 105 hero_icons.png); заклинания над героем — один лист 9×16" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Листы состояний</title>
<style>
  html, body { margin: 0; background: var(--void); }
  .row { display: flex; gap: 24px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 8px; flex: none; }
  .cap { margin: 0; height: 20px; font: var(--text-caption, 400 15px/20px var(--font-small)); color: var(--ink-muted); }
  .cap b { color: var(--gold); font-weight: 400; }
  .phone { position: relative; overflow: hidden; --safe-t: 0px; --safe-b: 34px; flex: none; }
</style></head>
<body>
<div class="pd-root row" id="row"></div>
<script>
  var q = new URLSearchParams(location.search), L = q.get('lang') || 'ru', en = L === 'en';
  function phone(w, h, cap) { var c = document.createElement('div'); c.className = 'col'; c.innerHTML = '<p class="cap">' + (cap || '') + '</p>'; var p = document.createElement('div'); p.className = 'phone pd-phone'; p.style.width = w + 'px'; p.style.height = h + 'px'; c.appendChild(p); document.getElementById('row').appendChild(c); return p; }
  function game(p) { var g = document.createElement('div'); g.style.cssText = 'position:absolute;inset:0'; p.appendChild(g); PD.demo.game(g); return g; }
  function gm(p, o) { o = o || {}; o.mates = false; o.noMobs = true; o.depth = o.depth || 12; PD.demo.game(p, o); return p; }
  var row = document.getElementById('row'); row.style.cssText = 'display:flex;flex-direction:column;gap:14px;padding:16px;width:1068px;box-sizing:content-box;align-items:stretch'; var V = PD.demo.v22[L];
  var sec = function (t, html) { return '<section><h3 style="margin:0 0 6px;font:var(--text-label);color:var(--gold);font-weight:400">' + t + '</h3><div class="pd-legend">' + html + '</div></section>'; };
  var cl = ['ascend', 'many', 'body', 'mind', 'spirit', 'wall', 'hallowed'].map(function (k, i) { return '<div><i class="pd-cbuff" style="--ix:' + i + '"></i><i class="pd-cbuff large" style="--ix:' + i + '"></i><span>' + V.buffs[k][0] + '<small>' + V.buffs[k][1] + '</small></span></div>'; }).join('');
  var TK = ['improvised', 'rejuvenating', 'seerShot', 'patientStrike', 'aggressiveBarrier', 'lethalHaste', 'swiftEquip', 'swiftEquip2', 'searingLight', 'liquidAgility', 'deadlyFollowup', 'preciseAssault', 'followupStrike', 'provokedAnger', 'lingeringMagic', 'satiatedSpells'];
  var KIND = [V.cd, V.cd, V.cd, V.cd, V.cd, V.cd, V.cd, V.cd, V.cd, V.mark, V.mark, V.mark, V.mark, V.weapon, V.weapon, V.food];
  var tl = TK.map(function (k, i) { return '<div><i class="pd-tlbuff" style="--ix:' + i + '"></i><i class="pd-tlbuff large" style="--ix:' + i + '"></i><span>' + V.talent[k] + '<small>' + KIND[i] + '</small></span></div>'; }).join('');
  var cb = V.combo.map(function (c, i) { return '<div><i class="pd-cmbuff" style="--ix:' + i + '"></i><i class="pd-cmbuff large" style="--ix:' + i + '"></i><span>' + c[1] + '<small>buffs.png 17</small></span></div>'; }).join('');
  var sp = V.spell.map(function (n, i) { return '<div><span></span><i class="pd-spellspr" style="--ix:' + i + '"></i><span>' + n + '<small>' + i + (i === 8 ? ' · PD 1.9' : '') + '</small></span></div>'; }).join('');
  row.innerHTML = sec(en ? 'Cleric' : 'Клирик', cl) + sec(en ? 'Talents' : 'Таланты', tl) + sec(en ? 'Combo' : 'Комбо', cb) + sec(en ? 'Spells over the hero' : 'Заклинания над героем', sp); PD.sprite(row);
</script>
</body>
</html>
