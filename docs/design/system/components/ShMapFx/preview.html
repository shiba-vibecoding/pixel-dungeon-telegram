<!-- @dsCard group="Shattered" height=812 width=1572 page subtitle="Призматическое отражение — своя фигура из радужного стекла (4 фазы цвета по 120 мс), сердечко союзника над ним; призрак-спутник из засохшей розы — полупрозрачный, с голубым светом; эфирные цепи — звенья летят к цели и тянут; снаряды палочек — 12 своих спрайтов со шлейфом; значок опасности справа: сколько врагов видят героя" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Эффекты на карте</title>
<style>
  html, body { margin: 0; background: var(--void); }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .phone { position: relative; width: 375px; height: 812px; overflow: hidden; --safe-t: 0px; --safe-b: 34px; flex: none; }
  .tag { position: absolute; left: 8px; top: 150px; z-index: 40; padding: 2px 8px; font: var(--text-caption, 400 15px/20px var(--font-small)); color: var(--gold); background: rgba(11,11,9,.8); clip-path: var(--notch); }
</style></head>
<body>
<div class="pd-root row" id="row"></div>
<script>
  var q = new URLSearchParams(location.search), L = q.get('lang') || 'ru', en = L === 'en';
  function phone() { var p = document.createElement('div'); p.className = 'phone pd-phone'; document.getElementById('row').appendChild(p); return p; }
  function tag(p, t) { var s = document.createElement('span'); s.className = 'tag'; s.textContent = t; p.appendChild(s); return s; }
  var a = phone(); PD.demo.game(a, { mates: false, names: false, lvl: 9 }); setTimeout(function () { PD.demo.mapFx(a, { prism: true, heart: true, bolt: -1, lang: L, boltLabel: tag(a, '') }); }, 50);
  var b = phone(); PD.demo.game(b, { mates: false, names: false, lvl: 9 }); setTimeout(function () { PD.demo.mapFx(b, { ghost: true, heart: true }); tag(b, en ? 'Ghost companion' : 'Призрак-спутник'); }, 50);
  var c = phone(); PD.demo.game(c, { mates: false, names: false, lvl: 9 }); setTimeout(function () { PD.demo.mapFx(c, { chains: true }); tag(c, en ? 'Ethereal chains' : 'Эфирные цепи'); }, 50);
  var d = phone(); PD.demo.game(d, { mates: false, names: false, lvl: 9, danger: 3, dangerNew: true }); setTimeout(function () { var m = d.querySelector('canvas.pd-map'), ox = Math.round(m.clientWidth / 2 - 6.5 * 32), oy = Math.round(m.clientHeight * .46 - 15.5 * 32); d.insertAdjacentHTML('beforeend', '<i class="pd-danger-ring" style="left:' + (ox + 3 * 32 - 2) + 'px;top:' + (oy + 16 * 32 - 2) + 'px;width:36px;height:36px"></i>'); tag(d, en ? 'Seen by 3 · tap for the next' : 'Видят 3 · касание — следующий'); }, 50);
  PD.sprite(document.body);
</script>
</body>
</html>
