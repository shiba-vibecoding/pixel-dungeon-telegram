<!-- @dsCard group="После форума" height=852 width=1572 page subtitle="Метка забега: «зачёт» (зелёная галочка), «повтор» (голубые стрелки), «свой сид» (фиолетовый росток), «без зачёта» (серый перечёркнутый круг). В окне смерти — под заголовком, с пояснением; в меню игры — в подзаголовке, перед глубиной" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Метка забега</title>
<style>
  html, body { margin: 0; background: var(--void); }
  .row { display: flex; gap: 24px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 8px; flex: none; }
  .cap { margin: 0; height: 20px; font: var(--text-caption, 400 15px/20px var(--font-small)); color: var(--ink-muted); }
  .cap b { color: var(--gold); font-weight: 400; }
  .phone { position: relative; overflow: hidden; --safe-t: 0px; --safe-b: 34px; flex: none; }
</style></head>
<body>
<div class="pd-root row" id="row"></div>
<script>
  var q = new URLSearchParams(location.search), L = q.get('lang') || 'ru', en = L === 'en';
  function phone(w, h, cap) { var c = document.createElement('div'); c.className = 'col'; c.innerHTML = '<p class="cap">' + (cap || '') + '</p>'; var p = document.createElement('div'); p.className = 'phone pd-phone'; p.style.width = w + 'px'; p.style.height = h + 'px'; c.appendChild(p); document.getElementById('row').appendChild(c); return p; }
  function game(p) { var g = document.createElement('div'); g.style.cssText = 'position:absolute;inset:0'; p.appendChild(g); PD.demo.game(g); return g; }
  function gm(p, o) { o = o || {}; o.mates = false; o.noMobs = true; o.depth = o.depth || 12; PD.demo.game(p, o); return p; }
  var a = gm(phone(375, 812, en ? '<b>Death</b> · ranked' : '<b>Смерть</b> · зачёт')); PD.demo.overlay(a, PD.demo.win.died(L, 'ranked'));
  var b = gm(phone(375, 812, en ? '<b>Death</b> · unranked' : '<b>Смерть</b> · без зачёта')); PD.demo.overlay(b, PD.demo.win.died(L, 'unranked'));
  var c = gm(phone(375, 812, en ? '<b>Menu</b> · replay' : '<b>Меню</b> · повтор')); PD.demo.overlay(c, PD.demo.win.gameMenu(L, 'replay'));
  var d = gm(phone(375, 812, en ? '<b>Menu</b> · own seed' : '<b>Меню</b> · свой сид')); PD.demo.overlay(d, PD.demo.win.gameMenu(L, 'seed'));
  PD.sprite(document.body);
</script>
</body>
</html>
