<!doctype html>
<html>
<head><meta charset="utf-8"><title>Таланты</title>
<style>
  html, body { margin: 0; background: var(--void); }
  .row { display: flex; gap: 24px; }
  .phone { position: relative; width: 375px; height: 812px; overflow: hidden; --safe-t: 0px; --safe-b: 34px; flex: none; }
  .dim .pd-overlay:first-of-type { filter: brightness(.55); }
</style></head>
<body>
<div class="pd-root row" id="row"></div>
<script>
  var q = new URLSearchParams(location.search), L = q.get("lang") || "ru", en = L === "en";
  function phone() { var p = document.createElement("div"); p.className = "phone pd-phone"; document.getElementById("row").appendChild(p); return p; }
  var a = phone(); PD.demo.game(a, { lvl: 14, talent: true, mates: false }); PD.demo.overlay(a, PD.demo.win.talents(L, { }));
  var b = phone(); b.classList.add("dim"); PD.demo.game(b, { lvl: 14, talent: true, mates: false }); PD.demo.overlay(b, PD.demo.win.talents(L, { sel: 14 })); PD.demo.overlay(b, PD.demo.win.talentCard(L)).style.background = "none";
  var c = phone(); PD.demo.game(c, { lvl: 14, talent: true, mates: false, toast: PD.demo.shT[L].toast, toastType: "badge", log: [[en ? "You are now level 14!" : "Вы достигли 14 уровня!", "good"], [PD.demo.shT[L].toast, "good"]] });
  PD.sprite(document.body);
</script>
</body>
</html>
